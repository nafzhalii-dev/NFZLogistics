<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <!--
      This is a pre-JS fallback only. Every route sets its own title, meta
      description, robots, canonical, Open Graph, and Twitter Card tags at
      runtime via src/components/seo/SEO.tsx (react-helmet-async). Per-page
      description/robots/canonical/og:*/twitter:* tags are intentionally NOT
      duplicated here — react-helmet-async cannot remove or override tags
      that were never rendered by Helmet, so keeping them here would leave
      stale duplicates in the DOM once a page's real metadata loads.
    -->
    <title>حلول لوجستية وسلاسل إمداد متكاملة في السعودية | نفذ للخدمات اللوجستية</title>
    <meta name="keywords" content="شركة لوجستيات في السعودية, شركة شحن في الرياض, خدمات النقل في السعودية, الشحن والتوصيل, التخزين والخدمات اللوجستية, التخليص الجمركي, تتبع الشحنات, Logistics Company Saudi Arabia, Logistics Services Riyadh, Shipping Company Saudi Arabia, Freight Forwarding Saudi Arabia, Warehousing Saudi Arabia, Transportation Company Riyadh, Last Mile Delivery Saudi Arabia, Supply Chain Solutions Saudi Arabia" />
    <meta name="author" content="NFZ Logistics" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NFZ Logistics",
      "alternateName": "نفذ للخدمات اللوجستية",
      "url": "https://nfzlogistics.sa",
      "logo": "https://nfzlogistics.sa/logo-icon.png",
      "description": "Integrated logistics and supply chain solutions across Saudi Arabia and GCC markets.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Riyadh",
        "addressCountry": "SA"
      },
      "telephone": "+966501234567",
      "areaServed": "SA"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
